<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><title>Quiz neón</title></head>
<body class="nm-stage">
<div class="nm-quiz">
  <span class="nm-overline">Pregunta 3 de 10 · PCI DSS</span>
  <div style="font:600 20px/28px var(--font-display)">¿Cada cuánto deben revisarse las cuentas de usuario y sus privilegios?</div>
  <button class="nm-opt"><span class="nm-opt__key">A</span><span>Solo cuando un empleado deja la empresa</span></button>
  <button class="nm-opt is-hover"><span class="nm-opt__key">B</span><span>Una vez al año (estado hover)</span></button>
  <button class="nm-opt is-correct"><span class="nm-opt__key">C</span><span>Al menos cada seis meses
    <span class="nm-opt__note" style="display:block"><strong>Correcto.</strong> Revisión semestral de cuentas y privilegios. <span class="nm-cite">PCI DSS v4.0 · Req. 7.2.4</span></span></span></button>
  <button class="nm-opt is-wrong"><span class="nm-opt__key">D</span><span>Nunca, si se usa autenticación multifactor
    <span class="nm-opt__note" style="display:block"><strong>No exactamente.</strong> La <span class="nm-term">Autenticación Multifactor<span class="nm-term__en">MFA</span></span> protege el acceso, pero no reemplaza la revisión de privilegios.</span></span></button>
</div>
</body>
</html>
